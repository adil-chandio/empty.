name: Render TABAHI 3D Animation

on:
  push:
    branches: [ arena/0189b9e9-empty ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg

      - name: Install numpy
        run: pip install numpy

      - name: Generate audio
        run: python3 generate_audio.py

      - name: Render frames with Blender
        run: |
          blender -b -P blender_render.py
          echo "=== Files in frames/ ==="
          ls -la frames/ 2>/dev/null | head -15
          echo "=== Total ==="
          ls frames/ 2>/dev/null | wc -l

      - name: Stitch MP4 with FFmpeg
        run: |
          echo "=== Check inputs ==="
          ls -lh audio.wav 2>/dev/null || echo "NO AUDIO"
          echo "Frame files:" && ls frames/ 2>/dev/null | head -5
          echo "Last frame:" && ls frames/ 2>/dev/null | tail -1
          echo "=== Try glob pattern ==="
          ffmpeg -y -framerate 60 -pattern_type glob -i 'frames/*.png' -i audio.wav \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            -crf 18 -preset fast tabahi.mp4 2>&1
          ls -lh tabahi.mp4 2>/dev/null || echo "NO MP4"

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabahi-mp4
          path: tabahi.mp4
          retention-days: 7
