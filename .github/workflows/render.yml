name: Render TABAHI 3D Animation

on:
  push:
    branches: [ arena/0189b9e9-empty ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          curl -sL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender.tar.xz
          echo "BLENDER_PATH=$(pwd)/blender-4.2.3-linux-x64/blender" >> $GITHUB_ENV

      - name: Verify Blender
        run: ${{ env.BLENDER_PATH }} --version

      - name: Generate audio with Python
        run: |
          python3 -c "
import numpy as np
import wave

sample_rate = 48000
duration = 30
t = np.linspace(0, duration, int(sample_rate * duration), False)

drone = 0.12 * (np.sin(2*np.pi*55*t) + np.sin(2*np.pi*82.4*t) + np.sin(2*np.pi*110*t))

heartbeat = np.zeros_like(t)
beat_interval = sample_rate
for i in range(int(duration)):
    start = int(i * beat_interval)
    end = min(start + int(0.16 * sample_rate), len(t))
    beat_t = np.linspace(0, 0.16, end - start)
    heartbeat[start:end] += 0.34 * np.sin(2*np.pi*55*beat_t) * np.exp(-beat_t*15)

audio = np.clip(drone + heartbeat, -1.0, 1.0)

with wave.open('audio.wav', 'wb') as wf:
    wf.setnchannels(1)
    wf.setsampwidth(2)
    wf.setframerate(sample_rate)
    wf.writeframes((audio * 32767).astype(np.int16).tobytes())

print('audio.wav generated:', duration, 'seconds')
"
          ls -lh audio.wav

      - name: Render animation frames with Blender
        run: |
          ${{ env.BLENDER_PATH }} -b -P blender_render.py
          echo "Total frames: $(ls frames/*.png 2>/dev/null | wc -l)"

      - name: Stitch frames to MP4 with FFmpeg
        run: |
          ffmpeg -framerate 60 -i frames/%04d.png -i audio.wav \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            -crf 18 -preset slow tabahi.mp4
          ls -lh tabahi.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabahi-mp4
          path: tabahi.mp4
          retention-days: 7
