name: Render TABAHI 3D Animation

on:
  push:
    branches: [ arena/0189b9e9-empty ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          curl -sL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender.tar.xz
          echo "BLENDER_PATH=$PWD/blender-4.2.3-linux-x64/blender" >> $GITHUB_ENV

      - name: Verify Blender
        run: ${{ env.BLENDER_PATH }} --version

      - name: Install numpy
        run: pip install numpy

      - name: Generate audio
        run: |
          python3 -c "
import numpy as np, wave
sr = 48000
dur = 30
t = np.linspace(0, dur, int(sr*dur), False)
drone = 0.12*(np.sin(2*np.pi*55*t)+np.sin(2*np.pi*82.4*t)+np.sin(2*np.pi*110*t))
hb = np.zeros_like(t)
bi = sr
for i in range(int(dur)):
    s = int(i*bi)
    e = min(s+int(0.16*sr), len(t))
    bt = np.linspace(0, 0.16, e-s)
    hb[s:e] += 0.34*np.sin(2*np.pi*55*bt)*np.exp(-bt*15)
a = np.clip(drone+hb, -1, 1)
with wave.open('audio.wav','wb') as wf:
    wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(sr)
    wf.writeframes((a*32767).astype(np.int16).tobytes())
print('audio.wav done')
"

      - name: Render frames with Blender
        run: |
          ${{ env.BLENDER_PATH }} -b -P blender_render.py
          echo "Frames: $(ls frames/*.png 2>/dev/null | wc -l)"

      - name: Stitch MP4 with FFmpeg
        run: |
          ffmpeg -framerate 60 -i frames/%04d.png -i audio.wav \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            -crf 18 -preset slow tabahi.mp4
          ls -lh tabahi.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabahi-mp4
          path: tabahi.mp4
          retention-days: 7
